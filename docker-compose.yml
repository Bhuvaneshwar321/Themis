services:
  db:
    image: pgvector/pgvector:pg16
    container_name: themis-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=themis
    volumes:
      - themis_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  themis_db_data:
